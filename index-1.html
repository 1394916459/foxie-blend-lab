<style>
*{box-sizing:border-box}body{margin:0;color:#34344c;background:#eeeaf4;font:14px system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #dcd5e6;background:#fffaf4;color:#444056;border-radius:14px;padding:12px;touch-action:manipulation}button:disabled{opacity:.4;cursor:default}button.active,.primary{background:#67558b;color:white;border-color:#67558b}button:focus-visible{outline:3px solid #dca45a}header{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;background:#ffffffb8;gap:10px}h1{font:26px Georgia,serif;margin:2px 0}small,.muted{color:#82788e;font-size:12px}.brand{letter-spacing:3px;font-size:10px;color:#89739c}.tools{display:flex;gap:6px}.tools button{padding:9px}main{max-width:1250px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:18px}.scene{position:relative;border-radius:26px;overflow:hidden;background:#dce7ed;box-shadow:0 20px 60px #74648520;align-self:start}.scene canvas{display:block;width:100%;aspect-ratio:1/1}.scene-note{position:absolute;top:18px;left:18px;background:#fffaf2d9;padding:10px 14px;border-radius:12px;max-width:80%;pointer-events:none}.scene-note b{display:block;font:20px Georgia,serif}.scene-bottom{position:absolute;bottom:16px;left:16px;right:16px;display:flex;gap:8px;justify-content:space-between}.scene-bottom span{background:#fffaf0e8;padding:8px 12px;border-radius:20px;font-size:12px}.panel{background:#fffcf8;border:1px solid white;border-radius:24px;padding:20px;box-shadow:0 10px 30px #74648512}nav{display:flex;gap:5px;margin:0 0 18px}nav button{flex:1;padding:10px 4px;font-size:12px}h2{font-size:21px;margin:4px 0 8px}p{line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{text-align:left;min-height:72px}.card b{display:block;margin-bottom:6px}.card small{display:block}.active small{color:#e3d9f0}label{display:block;margin:16px 0 8px}input[type=range]{width:100%;accent-color:#806 x}.scene{border-radius:20px;margin-bottom:12px}.scene canvas{aspect-ratio:1.22}.panel{padding:15px}.tools button{font-size:12px;padding:9px 7px}.scene-note{top:12px;left:12px;font-size:11px}.scene-note b{font-size:17px}.scene-bottom{bottom:10px}.scene-bottom span{font-size:10px;padding:6px 9px}nav{position:sticky;top:0;background:#fffcf8;z-index:2;padding:5px 0}.grid{gap:7px}footer{padding-bottom:25px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

<header><div><div class="brand">YOUR LITTLE COFFEE ATELIER</div><h1>Foxie Blend Lab <span style="font-size:18px">🦊</span></h1></div><div class="tools"><button id="weather" aria-label="切换天气">☀ 晴窗</button><button id="sound" aria-label="切换声音">♪ 关</button><button id="shelf">特调册</button></div></header>
<main><section class="scene"><canvas id="scene" aria-label="动态咖啡吧台：磨豆机、咖啡机与调饮杯"></canvas><div class="scene-note"><small>MADE BY FOXIE</small><b id="sceneTitle">一杯，随你喜欢。</b><span id="sceneSub">从一罐喜欢的豆子开始。</span></div><div class="scene-bottom"><span id="cupInfo">玻璃杯 · 320 ml</span><span id="collection">私人吧台 · 随时打烊</span></div></section><section class="panel"><nav id="tabs"></nav><div id="body"></div><div class="ticket" id="guest"></div></section></main><footer>独立游戏存档 · 不扣真实咖啡库存 · 风味与萃取为简化游戏模型 · 无外部依赖</footer><dialog id="modal"></dialog><div id="toast" class="toast" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s), KEY='foxie-blendlab-v1';
const beans=[{name:'日晒西达摩',tag:'莓果 · 柑橘 · 轻盈',color:'#b67e82',fruit:.85,bitter:.25,body:.4},{name:'经典意式拼配',tag:'坚果 · 焦糖 · 醇厚',color:'#88705d',fruit:.15,bitter:.65,body:.9},{name:'花香瑰夏',tag:'橙花 · 蜂蜜 · 明亮',color:'#aaa36c',fruit:.7,bitter:.15,body:.3},{name:'低因哥伦比亚',tag:'蔗糖 · 可可 · 柔和',color:'#8e8bad',fruit:.3,bitter:.3,body:.65}];
const ingredients=[{id:'milk',name:'牛奶',color:'#f3e7ce',ml:30,sweet:.1,cream:1},{id:'coconut',name:'椰乳',color:'#eee8df',ml:30,sweet:.3,cream:.9},{id:'water',name:'清水',color:'#b9dce5',ml:30},{id:'soda',name:'气泡水',color:'#c5e8e3',ml:30,fizz:1},{id:'orange',name:'橙汁',color:'#f4b94d',ml:20,sweet:.45,fruit:1},{id:'berry',name:'莓果汁',color:'#b7567b',ml:20,sweet:.55,fruit:1},{id:'peach',name:'白桃汁',color:'#edc1b0',ml:20,sweet:.6,fruit:.9},{id:'caramel',name:'焦糖糖浆',color:'#bd7942',ml:5,sweet:3},{id:'vanilla',name:'香草糖浆',color:'#ead19b',ml:5,sweet:3},{id:'foam',name:'绵密奶泡',color:'#fff7e7',ml:20,cream:1}];
let saved={recipes:[],served:0,visits:{}};try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.recipes))saved={recipes:v.recipes.filter(r=>r&&Array.isArray(r.layers)).slice(0,40),served:Number(v.served)||0,visits:v.visits||{}}}catch(e){}
let step=0,bean=0,grind=5,dose=0,grinding=false,brewing=false,elapsed=0,yieldMl=0,shot=null,layers=[],ice=0,mixed=false,cup=0,garnish='none',art=[],mode='free',order=null,served=false,weather=0,audioOn=false,lastAdd=-10,clock=0;
const caps=[320,220,420],cupNames=['玻璃杯','陶瓷杯','高脚杯'];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){toast('浏览器未能保存，请导出特调册备份。')}}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,3000)}
let ac;function tone(f=500){if(!audioOn)return;try{ac??=new (window.AudioContext||window.webkitAudioContext)();ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.035,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.16);o.start();o.stop(ac.currentTime+.17)}catch(e){}}
const total=()=>layers.reduce((a,l)=>a+l.ml,0),occupied=()=>total()+ice*18;
function add(id){if(served)return toast('这一杯已经端出啦，点击「新开一杯」。');let x=id==='espresso'?{id,name:'浓缩',color:'#68402c',ml:shot?.ml||0}:ingredients.find(i=>i.id===id);if(!x||!x.ml)return;const n=Math.min(x.ml,caps[cup]-occupied());if(n<1)return toast('杯子满啦，可以换大杯或撤销一次。');layers.push({...x,ml:n});if(id==='espresso'){shot.ml-=n;if(shot.ml<.5)shot.ml=0}mixed=false;lastAdd=clock;render();tone(650)}
function undo(){if(served)return;let l=layers.pop();if(l?.id==='espresso'&&shot)shot.ml+=l.ml;mixed=false;render()}
function flavor(){const t=Math.max(total(),1),espresso=layers.filter(x=>x.id==='espresso').reduce((a,x)=>a+x.ml,0);let v={sweet:0,cream:0,fruit:0,fizz:0,strength:espresso/t,cold:ice>0,decaf:bean===3};layers.forEach(l=>{const i=ingredients.find(x=>x.id===l.id)||{};for(const k of ['sweet','cream','fruit','fizz'])v[k]+=(i[k]||0)*l.ml/t});v.fruit+=beans[bean].fruit*v.strength*.5;v.bitter=beans[bean].bitter*v.strength+(shot?.extraction==='偏长'?.15:0);return v}
const people=['Daniel','Astra','Sol','带着画册的旅人','窗边的花店姐姐','散步来的妈咪'];
const wishes=[{text:'冰凉、果香明显，今天不想喝奶。',key:'fruit',check:v=>v.fruit>.22&&v.cold&&v.cream<.1,advice:'试试果汁配冰块，奶类会盖住我想要的清爽。'},{text:'温柔奶香，不要太甜。',key:'cream',check:v=>v.cream>.4&&v.sweet<.35,advice:'可以增加奶的比例，糖浆少一些。'},{text:'想要气泡和果香一起冒出来。',key:'fizz',check:v=>v.fizz>.2&&v.fruit>.15,advice:'气泡水与一点果汁会很适合。'},{text:'浓一点，有奶也要喝得到咖啡。',key:'strong',check:v=>v.strength>.22&&v.cream>.2,advice:'少加一点稀释材料，保留浓缩的存在感。'},{text:'晚上想喝低因，带一点奶香。',key:'decaf',check:v=>v.decaf&&v.cream>.2,advice:'换低因豆，搭配牛奶或椰乳就好。'},{text:'甜甜的冰奶咖，像一份小甜点。',key:'sweet',check:v=>v.sweet>.32&&v.cream>.25&&v.cold,advice:'我期待冰块、奶和一点糖浆。'}];
function newOrder(){const prev=order?.wi;let wi=Math.floor(Math.random()*wishes.length);if(wi===prev)wi=(wi+1)%wishes.length;order={who:people[Math.floor(Math.random()*people.length)],wi};renderGuest()}
function renderGuest(){const g=$('#guest');g.replaceChildren();const row=document.createElement('div');row.className='row';for(const [id,label]of [['free','自由调饮'],['guest','来客模式']]){const b=document.createElement('button');b.textContent=label;b.className=mode===id?'active':'';b.onclick=()=>{mode=id;if(id==='guest'&&!order)newOrder();renderGuest()};row.append(b)}g.append(row);const p=document.createElement('p');if(mode==='free')p.textContent='今天没有标准答案。试一个新搭配，给它起个只有你会起的名字。';else{p.textContent=order.who+'：'+wishes[order.wi].text;const b=document.createElement('button');b.textContent='换一位客人';b.onclick=newOrder;g.append(p,b);return}g.append(p)}
function render(){const labels=['01 选豆','02 磨粉','03 萃取','04 特调'];$('#tabs').innerHTML=labels.map((l,i)=>`<button class="${i===step?'active':''}" data-step="${i}">${l}</button>`).join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(brewing||grinding)return toast('先停止机器，再切换工作台。');step=+b.dataset.step;render()});$('#cupInfo').textContent=cupNames[cup]+' · '+Math.round(total())+' / '+caps[cup]+' ml';$('#collection').textContent='收藏 '+saved.recipes.length+' 杯 · 已出杯 '+saved.served;$('#sceneTitle').textContent=['挑一罐今天的心情','磨出你的节奏','看着第一滴落下','这一杯，你来命名'][step];$('#sceneSub').textContent=['果香、花香、醇厚，或温柔低因。','按住磨粉，松手停止。','流速会随着研磨与粉量改变。','加入顺序会留在杯子里。'][step];let h='';if(step===0){h='<h2>你的豆子架</h2><p class="hint">灵感来自 Foxie 的咖啡档案。游戏风味不是实际品鉴预测。</p><div class="grid">'+beans.map((b,i)=>`<button class="card ${bean===i?'active':''}" data-bean="${i}"><b>${b.name}</b><small>${b.tag}</small></button>`).join('')+'</div><p class="hint">更换豆子会重新准备粉与浓缩；杯中已有饮品需先新开一杯。</p><button class="primary" id="next">去磨豆 →</button>'}else if(step===1){h=`<h2>${beans[bean].name}</h2><label>研磨刻度 <b id="grindval">${grind}</b> · 左细右粗</label><input id="grind" type="range" min="1" max="9" value="${grind}" ${dose>0?'disabled':''}><div class="metric"><span id="dose">${dose.toFixed(1)}</span> g<small>随手参考：18–22 g · 上限 24 g</small></div><button id="hold" class="hold primary" ${shot||served?'disabled':''}>按住磨粉 · 松开停止</button><div class="row" style="margin-top:10px"><button id="resetDose" ${shot||served?'disabled':''}>重新磨粉</button><button id="next">去萃取 →</button></div>`}else if(step===2){h=`<h2>把时间交给这一杯</h2><p class="hint">${beans[bean].name} · 刻度 ${grind} · ${dose.toFixed(1)} g<br>时间为加速游戏时间；流速与浓度是简化模拟。</p><div class="metric"><span id="brewtime">${elapsed.toFixed(1)}</span> s　<span id="yield">${yieldMl.toFixed(1)}</span> ml<small id="flow">${shot?'本次萃取：'+shot.extraction:'准备好后启动机器，自己决定停杯。'}</small></div><button id="brew" class="primary hold" ${served||shot?'disabled':''}>${brewing?'停止萃取':'启动萃取'}</button><div class="row" style="margin-top:10px"><button id="redo" ${layers.some(l=>l.id==='espresso')||served?'disabled':''}>重新准备一份</button><button id="next">去调饮 →</button></div><p class="hint">浓缩先留在量杯里。你可以先加奶，再倒浓缩，试一杯 Dirty。</p>`}else{h=`<h2>今天调什么？</h2><div class="row"><select id="cup" aria-label="杯型">${cupNames.map((x,i)=>`<option value="${i}" ${cup===i?'selected':''}>${x} ${caps[i]}ml</option>`).join('')}</select><button id="ice">🧊 冰块 ${ice}/5</button></div><div class="grid" style="margin-top:12px"><button class="ingredient" style="--tint:#68402c" data-add="espresso" ${!shot?.ml||served?'disabled':''}><strong>倒入浓缩</strong><small>量杯剩余 ${Math.round(shot?.ml||0)} ml</small></button>${ingredients.map(i=>`<button class="ingredient" style="--tint:${i.color}" data-add="${i.id}" ${served?'disabled':''}><strong>${i.name}</strong><small>＋${i.ml} ml</small></button>`).join('')}</div><div class="row" style="margin-top:12px"><button id="undo">撤销加料</button><button id="stir">搅一搅</button><button id="latte">手绘拉花</button></div><label>最后的小装饰</label><select id="garnish"><option value="none">不加装饰</option><option value="orange">橙片</option><option value="mint">薄荷</option><option value="cocoa">可可粉</option></select><div class="list">${layers.map(l=>`<div class="layer"><span>${l.name}</span><span>${Math.round(l.ml)} ml</span></div>`).join('')}</div><label for="name">给这杯起个名字</label><input id="name" maxlength="32" placeholder="例如：狐狸的晚风"><div class="row" style="margin-top:12px"><button id="serve" class="primary" ${served?'disabled':''}>${served?'已出杯':'端出这一杯'}</button><button id="save">收藏配方</button><button id="photo">拍照</button></div><div id="result"></div><button id="new" style="margin-top:14px;width:100%">＋ 新开一杯</button>`}$('#body').innerHTML=h;
document.querySelectorAll('[data-bean]').forEach(b=>b.onclick=()=>{if(layers.length||served)return toast('先新开一杯，再换豆子。');bean=+b.dataset.bean;dose=0;shot=null;elapsed=yieldMl=0;render();tone()});$('#next')?.addEventListener('click',()=>{step=Math.min(3,step+1);render()});$('#grind')?.addEventListener('input',e=>{grind=+e.target.value;$('#grindval').textContent=grind});const hold=$('#hold');if(hold){hold.onpointerdown=e=>{if(hold.disabled)return;e.preventDefault();hold.setPointerCapture(e.pointerId);grinding=true;tone(160)};hold.onpointerup=hold.onpointercancel=hold.onlostpointercapture=()=>{grinding=false;render()};hold.onkeydown=e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();grinding=true}};hold.onkeyup=()=>{grinding=false;render()}}
$('#resetDose')?.addEventListener('click',()=>{dose=0;render()});$('#brew')?.addEventListener('click',()=>{if(brewing)stopBrew();else if(dose<8)toast('至少磨 8 g，再启动机器。');else{brewing=true;elapsed=yieldMl=0;render();tone(240)}});$('#redo')?.addEventListener('click',()=>{brewing=false;shot=null;dose=0;elapsed=yieldMl=0;step=1;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));$('#cup')?.addEventListener('change',e=>{const n=+e.target.value;if(occupied()>caps[n]){toast('这只杯子装不下，先撤销一些材料。');e.target.value=cup;return}cup=n});$('#ice')?.addEventListener('click',()=>{if(served)return;if(ice===5)ice=0;else if(occupied()+18<=caps[cup])ice++;else toast('杯子没有空间放冰块啦。');render()});$('#undo')?.addEventListener('click',undo);$('#stir')?.addEventListener('click',()=>{if(served)return;mixed=true;lastAdd=clock;tone(350);toast('轻轻搅匀，颜色融在一起。')});$('#garnish')?.addEventListener('change',e=>{if(!served)garnish=e.target.value});if($('#garnish'))$('#garnish').value=garnish;$('#latte')?.addEventListener('click',openArt);$('#serve')?.addEventListener('click',serve);$('#save')?.addEventListener('click',saveRecipe);$('#photo')?.addEventListener('click',()=>{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='foxie-drink.png';a.click();toast('已生成吧台照片。')});$('#new')?.addEventListener('click',()=>{if(layers.length&&!served&&!confirm('放下当前这杯，重新开始？'))return;reset();if(mode==='guest')newOrder()});renderGuest()}
function stopBrew(){brewing=false;const ratio=yieldMl/Math.max(dose,1);shot={ml:yieldMl,original:yieldMl,extraction:ratio<1.4?'偏短':ratio>2.8?'偏长':'适中'};render();tone(750)}
function reset(){grinding=brewing=false;dose=elapsed=yieldMl=0;shot=null;layers=[];ice=0;mixed=false;art=[];garnish='none';served=false;step=0;render()}
function serve(){if(total()<25)return toast('先做至少 25 ml 饮品。');if(!layers.some(l=>l.id==='espresso'))return toast('别忘了加入你萃取的浓缩。');served=true;saved.served++;const v=flavor();let t=mode==='guest'?(wishes[order.wi].check(v)?order.who+'：这杯刚好合我心意！下次还想试你的新搭配。':order.who+'：谢谢你的特调。'+wishes[order.wi].advice):'你的特调出杯了。'+(v.fruit>.25?'果香走在前面。':'')+(v.cream>.35?'奶香柔和厚实。':'')+(v.fizz>.2?'气泡带来轻快的口感。':'')+(v.strength>.3?'咖啡存在感很强。':'咖啡被搭配柔和地展开。');if(mode==='guest'){saved.visits[order.who]=(saved.visits[order.who]||0)+1;t+=' · 第 '+saved.visits[order.who]+' 次到访'}persist();$('#serve').disabled=true;$('#serve').textContent='已出杯';$('#result').textContent=t;$('#result').className='feedback';$('#collection').textContent='收藏 '+saved.recipes.length+' 杯 · 已出杯 '+saved.served;tone(880)}
function saveRecipe(){if(total()<25)return toast('先调好一杯再收藏。');if(saved.recipes.length>=40)return toast('特调册满了，先导出或删除一款。');saved.recipes.unshift({name:$('#name').value.trim()||beans[bean].name+'特调',bean,grind,dose,shot:shot?{...shot}:null,layers:layers.map(l=>({...l})),ice,mixed,cup,garnish,art:art.map(p=>({...p})),date:new Date().toLocaleDateString('zh-CN')});persist();toast('已收进特调册，刷新也会保留。');tone(900)}
